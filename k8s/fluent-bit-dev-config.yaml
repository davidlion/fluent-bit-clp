apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-confs
  namespace: default
data:
  fluent-bit.conf: |
    [SERVICE]
        # Flush
        # =====
        # Set an interval of seconds before to blush record to destination
        Flush 1
    
        # Log_Level
        # =========
        # Set the verbosity level of the service, values can be:
        #
        # - error
        # - warning
        # - info
        # - debug
        # - trace
        #
        # by default 'info' is set, that means it includes 'error' and 'warning'.
        Log_Level info
    
        # Daemon
        # ======
        # instruct Fluent Bit to run in foreground or background mode.
        Daemon off
    
        # Plugins File
        # ============
        # specify an optional 'Plugins' configuration file to load external plugins.
        plugins_file /fluent-bit/confs/plugin-config.conf
    
    [INPUT]
        Name tail
        Path /tmp/test.log
        Tag raylogs
        Refresh_Interval 5
        Read_from_Head true
    
    [OUTPUT]
        name                  out_clp_ir_file
        line_format           json
  plugin-config.conf: |
    [PLUGINS]
        path /fluent-bit/plugins/out_clp_ir_file/out_clp_ir_file.so